[pretix]
instance_name=TEST ONLY - Hackertours November 2026
url=https://pretix.by.vincent.mahn.ke
currency=EUR
datadir=/data
registration=off
ecb_rates=false

[locale]
default=en
timezone=Europe/Berlin

[database]
backend=postgresql
name=pretix
user=pretix
host=database
; PRETIX_DATABASE_PASSWORD is provided by the deployment environment.

[redis]
location=redis://cache:6379/0
sessions=true

[celery]
broker=redis://cache:6379/1
backend=redis://cache:6379/2

[mail]
from=pretix@local.test
host=mail
port=1025
tls=false
ssl=false
