resolver 127.0.0.11 valid=10s ipv6=off;
upstream pretix_backend {
    zone pretix_backend 64k;
    server app:80 resolve;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 20m;

    location / {
        proxy_pass http://pretix_backend;
        proxy_set_header Host pretix.by.vincent.mahn.ke;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
